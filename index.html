    <!-- Applies the stored theme before first paint, so the page never flashes the
         wrong palette and the prerendered markup hydrates without a mismatch. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('portfolio-theme')
          if (t !== 'dark' && t !== 'light') {
            t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          }
          document.documentElement.setAttribute('data-theme', t)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      })()
    </script>

    <!-- Generated from src/data/portfolio.ts at build time (scripts/prerender.mjs)
         so the structured data cannot drift from what the page renders. -->
    <script type="application/ld+json" data-jsonld>{}</script>

  <body>
    <!-- The prerendered markup starts at opacity:0 for the scroll-reveal animation.
         Without JS the observer never runs, so un-hide it for no-script visitors. -->
    <noscript>
      <style>
        .reveal {
          opacity: 1 !important;
          transform: none !important;
        }
      </style>
    </noscript>
