<!doctype html>
<!--
  Source for public/images/og-image.jpg — the 1200x630 card social platforms show
  when the site is shared. Not part of the build; regenerate by hand after changing
  your name, title or stack.

    1. open scripts/og-card.html          (directly in a browser — file:// is fine)
    2. screenshot the card region at exactly 1200x630
    3. save it over public/images/og-image.jpg

  The body is sized to 1200x630 so a full-page capture is already the right shape.
  Fonts are the site's own stack, so this renders as SF Pro on macOS.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>OG card — Jeff Tan</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #07090f;
        font-family: -apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', Roboto,
          'Helvetica Neue', Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        color: #f1f4fa;
      }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        display: flex;
        align-items: center;
      }
      /* Mirrors the ambient light field in src/index.css */
      .glow {
        position: absolute;
        inset: -20%;
        background:
          radial-gradient(46% 55% at 74% 4%, rgba(58, 118, 255, 0.34), transparent 62%),
          radial-gradient(44% 50% at 10% 12%, rgba(146, 88, 255, 0.26), transparent 60%),
          radial-gradient(40% 45% at 46% 108%, rgba(255, 128, 92, 0.12), transparent 62%);
      }
      .shot {
        position: absolute;
        right: 0;
        top: 0;
        width: 660px;
        height: 630px;
        object-fit: cover;
        object-position: 50% 42%;
        -webkit-mask-image: linear-gradient(90deg, transparent 0%, rgba(0, 0, 0, 0.5) 55%, #000 100%);
        mask-image: linear-gradient(90deg, transparent 0%, rgba(0, 0, 0, 0.5) 55%, #000 100%);
        opacity: 0.55;
      }
      .body { position: relative; padding: 0 0 0 82px; max-width: 800px; }
      .kicker {
        font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, monospace;
        font-size: 20px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #7b8598;
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 26px;
      }
      .kicker::before {
        content: '';
        width: 42px;
        height: 1px;
        background: linear-gradient(90deg, transparent, #7b8598);
      }
      h1 { font-size: 108px; font-weight: 600; letter-spacing: -0.03em; line-height: 1; }
      .role {
        margin-top: 20px;
        font-size: 37px;
        font-weight: 400;
        letter-spacing: -0.018em;
        color: #b4bfd2;
      }
      .pills { display: flex; gap: 11px; margin-top: 40px; flex-wrap: wrap; }
      .pill {
        padding: 11px 20px;
        border: 1px solid rgba(140, 175, 255, 0.22);
        border-radius: 999px;
        background: rgba(120, 160, 255, 0.1);
        color: #a8c5ff;
        font-size: 21px;
        font-weight: 500;
      }
      .url {
        position: absolute;
        left: 82px;
        bottom: 56px;
        font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, monospace;
        font-size: 21px;
        color: #7b8598;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="glow"></div>
      <img class="shot" src="../public/images/mountain.webp" alt="" />
      <div class="body">
        <p class="kicker">Portfolio</p>
        <h1>Jeff Tan</h1>
        <p class="role">Senior Android Software Engineer</p>
        <div class="pills">
          <span class="pill">Kotlin</span>
          <span class="pill">Jetpack Compose</span>
          <span class="pill">Kotlin Multiplatform</span>
          <span class="pill">AWS</span>
        </div>
      </div>
      <p class="url">jiahan8.github.io</p>
    </div>
  </body>
</html>
